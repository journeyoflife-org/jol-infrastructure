# =============================================================================
# Terraform Plan — Staging
# Posts plan output as PR comment for peer review
# SOC 2 CC8.1 — Change management: all plans reviewed before apply
# =============================================================================
name: "Terraform Plan"

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "helm/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: tf-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.0"
  AWS_REGION: "eu-central-1"

jobs:
  # ---------------------------------------------------------------------------
  # Detect which environments have changes
  # ---------------------------------------------------------------------------
  detect-changes:
    name: "🔎 Detect Changed Environments"
    runs-on: ubuntu-latest
    outputs:
      dev: ${{ steps.changes.outputs.dev }}
      staging: ${{ steps.changes.outputs.staging }}
      prod: ${{ steps.changes.outputs.prod }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            dev:
              - 'terraform/environments/dev/**'
              - 'terraform/modules/**'
            staging:
              - 'terraform/environments/staging/**'
              - 'terraform/modules/**'
            prod:
              - 'terraform/environments/prod/**'
              - 'terraform/modules/**'

  # ---------------------------------------------------------------------------
  # Terraform Plan — per environment
  # ---------------------------------------------------------------------------
  plan:
    name: "📋 Plan — ${{ matrix.environment }}"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      (needs.detect-changes.outputs.dev == 'true') ||
      (needs.detect-changes.outputs.staging == 'true') ||
      (needs.detect-changes.outputs.prod == 'true')
    strategy:
      matrix:
        environment: [dev, staging, prod]
      fail-fast: false
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Determine AWS OIDC role
        id: aws
        env:
          DEV_ROLE: ${{ secrets.AWS_ROLE_DEV }}
          STAGING_ROLE: ${{ secrets.AWS_ROLE_STAGING }}
          PROD_ROLE: ${{ secrets.AWS_ROLE_PROD }}
        run: |
          case "${{ matrix.environment }}" in
            dev) role="${DEV_ROLE}" ;;
            staging) role="${STAGING_ROLE}" ;;
            prod) role="${PROD_ROLE}" ;;
          esac
          # The AWS stack (terraform/) is a legacy blueprint — production
          # runs 100% on-prem (Proxmox/bare-metal). With no AWS_ROLE_*
          # secret configured, plans run validation-only by design; a
          # non-ARN value is treated the same way.
          case "${role}" in
            arn:aws:iam::*) echo "role=${role}" >> "$GITHUB_OUTPUT" ;;
            "") echo "role=" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::warning::AWS_ROLE secret for '${{ matrix.environment }}' is not a role ARN — falling back to validation-only plan"
              echo "role=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Configure AWS credentials (OIDC)
        if: steps.aws.outputs.role != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.aws.outputs.role }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init (full backend)
        if: steps.aws.outputs.role != ''
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform init -input=false

      - name: Terraform Init (validation only)
        if: steps.aws.outputs.role == ''
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform validate

      - name: Terraform Plan
        if: steps.aws.outputs.role != ''
        id: plan
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan-output.txt
          terraform show -no-color tfplan > plan-detail.txt

      - name: Post Plan as PR Comment
        if: steps.aws.outputs.role != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: tf-plan-${{ matrix.environment }}
          message: |
            ## 📋 Terraform Plan — `${{ matrix.environment }}`

            <details>
            <summary>Plan Output (click to expand)</summary>

            ```hcl
            ${{ steps.plan.outputs.stdout }}
            ```

            </details>

            > ⚠️ Review this plan carefully before approving. Production applies require manual `workflow_dispatch`.

      - name: Post skipped-plan notice
        if: steps.aws.outputs.role == ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: tf-plan-${{ matrix.environment }}
          message: |
            ## ⏭️ Terraform Plan — `${{ matrix.environment }}` skipped

            No AWS OIDC role is configured for `${{ matrix.environment }}`, so only
            `terraform init -backend=false` + `terraform validate` were executed.

            This is expected while the platform runs 100% on-prem
            (Proxmox/bare-metal): the `terraform/` tree is kept as a validated
            blueprint, and on-prem provisioning is driven by Ansible
            (`ansible/`, `inventory/`). If AWS is ever adopted, add the role ARN
            as secret `AWS_ROLE_${{ matrix.environment }}` to enable real plans.
