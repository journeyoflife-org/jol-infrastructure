# =============================================================================
# Terraform Plan — Staging
# Posts plan output as PR comment for peer review
# SOC 2 CC8.1 — Change management: all plans reviewed before apply
# =============================================================================
name: "Terraform Plan"

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "helm/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: tf-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.0"
  AWS_REGION: "eu-central-1"

jobs:
  # ---------------------------------------------------------------------------
  # Detect which environments have changes
  # ---------------------------------------------------------------------------
  detect-changes:
    name: "🔎 Detect Changed Environments"
    runs-on: ubuntu-latest
    outputs:
      dev: ${{ steps.changes.outputs.dev }}
      staging: ${{ steps.changes.outputs.staging }}
      prod: ${{ steps.changes.outputs.prod }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            dev:
              - 'terraform/environments/dev/**'
              - 'terraform/modules/**'
            staging:
              - 'terraform/environments/staging/**'
              - 'terraform/modules/**'
            prod:
              - 'terraform/environments/prod/**'
              - 'terraform/modules/**'

  # ---------------------------------------------------------------------------
  # Terraform Plan — per environment
  # ---------------------------------------------------------------------------
  plan:
    name: "📋 Plan — ${{ matrix.environment }}"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      (needs.detect-changes.outputs.dev == 'true') ||
      (needs.detect-changes.outputs.staging == 'true') ||
      (needs.detect-changes.outputs.prod == 'true')
    strategy:
      matrix:
        environment: [dev, staging, prod]
      fail-fast: false
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan-output.txt
          terraform show -no-color tfplan > plan-detail.txt

      - name: Post Plan as PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: tf-plan-${{ matrix.environment }}
          message: |
            ## 📋 Terraform Plan — `${{ matrix.environment }}`

            <details>
            <summary>Plan Output (click to expand)</summary>

            ```hcl
            ${{ steps.plan.outputs.stdout }}
            ```

            </details>

            > ⚠️ Review this plan carefully before approving. Production applies require manual `workflow_dispatch`.
