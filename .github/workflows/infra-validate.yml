# =============================================================================
# Infrastructure Validation Pipeline
# Runs: TruffleHog, Checkov, tfsec, OPA tests, Helm lint
# Trigger: push/PR to main, develop, feature/*
# SOC 2 CC8.1 — All infrastructure changes are validated before merge
# =============================================================================
name: "Infrastructure Validation"

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "terraform/**"
      - "kubernetes/**"
      - "helm/**"
      - "policies/**"
      - "scripts/**"
      # Added 2026-11-01 (issue #134 follow-up, finding F-14): a direct push to `main` that touches
      # only the CC8.1 evidence record used to trigger NO pipeline at all, because a `pull_request`
      # run validates the PROPOSAL, not what landed. `CHANGELOG.md` and `docs/**` are where the
      # compliance records live, so they are now in scope for the push path as well.
      - "CHANGELOG.md"
      - "docs/**"
      - ".github/workflows/**"
      - "Makefile"
      - ".pre-commit-config.yaml"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write

concurrency:
  group: infra-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # CC8.1 evidence-record structure + control fixtures
  # Added 2026-11-01 (finding F-14, issue #134 follow-up). The checker this job runs was written
  # after 6 rows of the change record rendered with phantom columns, but it was wired ONLY into
  # `make lint-changelog` and a pre-commit hook that has never been installed on this working
  # copy (`.git/hooks/pre-commit` absent, recorded in .pre-commit-config.yaml). Measured 2026-11-01:
  # no CI job invoked it, so the guard could not fail a merge — a control that nothing runs is not
  # a control. This job also executes the host-free watchdog-gate fixtures, which previously ran
  # only by hand. It has NO `needs:`, so a secret-scan failure cannot mask a structural finding.
  # ---------------------------------------------------------------------------
  changelog-guard:
    name: "📋 CC8.1 Record + Gate Fixtures"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: CHANGELOG table check (self-test first, then the real scan)
        # stdlib-only python3, preinstalled on ubuntu-latest — no setup-python pin to verify
        run: python3 scripts/maintenance/check-changelog-table.py --self-test

      - name: Watchdog / helper gate fixtures (must be able to fail)
        run: make test-gates

  # ---------------------------------------------------------------------------
  # Secret Scanning — TruffleHog
  # ISO 27001 A.8.4 / SOC 2 CC6.1
  # ---------------------------------------------------------------------------
  trufflehog-scan:
    name: "🔐 TruffleHog Secret Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@288a8a8643a2c5a36b81d231c550dccfa0beeb64  # main
        with:
          extra_args: --only-verified

  # ---------------------------------------------------------------------------
  # Terraform Static Analysis — Checkov
  # CIS Benchmarks, NIST, SOC 2 policy packs
  # ---------------------------------------------------------------------------
  checkov-scan:
    name: "🛡️ Checkov Policy Scan"
    runs-on: ubuntu-latest
    needs: trufflehog-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e  # v12
        with:
          directory: terraform/
          framework: terraform
          config_file: policies/checkov/.checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          soft_fail: false

      - name: Upload SARIF results
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4
        with:
          sarif_file: checkov-results.sarif

  # ---------------------------------------------------------------------------
  # Terraform Security — Trivy (replaces deprecated tfsec)
  # ---------------------------------------------------------------------------
  trivy-scan:
    name: "🔒 Trivy IaC Security Scan"
    runs-on: ubuntu-latest
    needs: trufflehog-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Run Trivy on Terraform
        # trivy-action tags are v-prefixed (0.28.0 never existed — CI could
        # not resolve it); pinned to latest release v0.36.0.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'terraform/'
          scanners: 'misconfig'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload SARIF results
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4
        with:
          sarif_file: trivy-results.sarif

  # ---------------------------------------------------------------------------
  # OPA Policy Tests
  # SOC 2 CC6.1 — Logical access controls enforced via policy-as-code
  # ---------------------------------------------------------------------------
  opa-test:
    name: "📜 OPA Policy Tests"
    runs-on: ubuntu-latest
    needs: trufflehog-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@34a30e8a924d1b03ce2cf7abe97250bbb1f332b5  # v2
        with:
          version: latest

      - name: Run OPA tests
        run: |
          opa test policies/opa/ -v --coverage
          opa fmt --fail policies/opa/

  # ---------------------------------------------------------------------------
  # Shell Script Lint — ShellCheck
  # ---------------------------------------------------------------------------
  shell-lint:
    name: "🐚 Shell Script Lint"
    runs-on: ubuntu-latest
    needs: trufflehog-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Run ShellCheck
        run: |
          find scripts/ -name '*.sh' -exec shellcheck -x {} +

  # ---------------------------------------------------------------------------
  # Helm Lint — Chart validation
  # ---------------------------------------------------------------------------
  helm-lint:
    name: "⎈ Helm Chart Lint"
    runs-on: ubuntu-latest
    needs: trufflehog-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5

      - name: Lint Helm charts
        run: |
          for chart in helm/charts/jol-*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Linting $(basename $chart)..."
              helm lint "$chart"
            fi
          done

      - name: Template dry-run
        run: |
          for chart in jol-backend jol-frontend jol-analytics jol-commerce; do
            echo "Rendering $chart..."
            helm template "$chart" "helm/charts/$chart" > /dev/null
          done

  # ---------------------------------------------------------------------------
  # Dependency Review — License & vulnerability check for PRs
  # ---------------------------------------------------------------------------
  dependency-review:
    name: "📦 Dependency Review"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # GHAS + Dependency graph must be enabled for strict enforcement.
    # Until then, this job reports issues but does not block merges.
    # NOTE: continue-on-error lives on the STEP, not the job — job-level
    # does not flip the check-run conclusion that branch protection reads.
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Dependency Review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

      - name: Warn if Dependency Review is unavailable
        if: failure()
        run: |
          echo "::warning::Dependency Review requires GitHub Advanced Security and Dependency graph."
          echo "Enable them at https://github.com/${{ github.repository }}/settings/security_analysis"

  # ---------------------------------------------------------------------------
