# Dependabot — automated dependency updates
# Terraform ecosystems were removed 2026-11-04 by ADR-009 Phase 1: the AWS tree under
# terraform/ is frozen and never applied, so bumps against it cannot validate
# (see docs/adr/ADR-009-descope-frozen-aws-tree.md).
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci-cd"
    reviewers:
      - "journeyoflife-org/devops"
