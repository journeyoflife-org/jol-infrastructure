# Dependabot — automated dependency updates
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci-cd"
    reviewers:
      - "journeyoflife-org/devops"

  - package-ecosystem: "terraform"
    directory: "/terraform/bootstrap"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "terraform"
    ignore:
      - dependency-name: "hashicorp/aws"
        versions: ["6.x"]

  - package-ecosystem: "terraform"
    directory: "/terraform/environments/dev"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "terraform"
    ignore:
      - dependency-name: "hashicorp/aws"
        versions: ["6.x"]

  - package-ecosystem: "terraform"
    directory: "/terraform/environments/staging"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "terraform"
    ignore:
      - dependency-name: "hashicorp/aws"
        versions: ["6.x"]

  - package-ecosystem: "terraform"
    directory: "/terraform/environments/prod"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "terraform"
      - "production"
    ignore:
      - dependency-name: "hashicorp/aws"
        versions: ["6.x"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "python"
