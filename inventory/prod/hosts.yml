# =============================================================================
# JOL Infrastructure — Production Host Inventory
# Source of truth for server metadata. Consumed by Ansible, monitoring, and
# compliance tooling. Do NOT add secrets or credentials here.
# =============================================================================

all:
  children:
    prod:
      children:
        llm:
          vars:
            ansible_user: jol-admin
          hosts:
            llm-prod-lt01:
              # Commissioned 2026-08-08: bare-metal Ryzen 9 3950X, 64 GB,
              # NVMe-only, headless. Doc: docs/servers/llm-prod-lt01.md
              hostname: llm-prod-lt01
              ansible_host: 10.30.30.10
              role: llm
              environment: prod
              vlan: 30
              owner: jol-admin
              purpose: "CPU-only LLM inference (Ollama 0.32.6, 16C/32T, no GPU)"
              backup_enabled: true
              monitoring_enabled: true
              ssh_policy: key-only
              os: "ubuntu-24.04"
              hardware: bare-metal

        hypervisors:
          hosts:
            pve-prod-hv01:
              hostname: pve-prod-hv01
              ansible_host: 10.60.60.20
              role: hypervisor
              environment: prod
              vlan: 60
              owner: jol-admin
              purpose: "Proxmox VE 9.2 hypervisor for AI service VMs"
              # Corrected 2026-10-21: was true. No PBS datastore is registered on
              # this host and its only vzdump job is rejected by the scheduler
              # parser, so no VM backup runs. Target state and procedure:
              # docs/runbooks/hv01-storage-backup-reconfiguration.md
              backup_enabled: false
              # Corrected 2026-10-21: was true. No node_exporter and no netdata are
              # installed on this host (no units, packages, binaries or listeners on
              # 9100/19999). Only artifact is the 06:00 cron watchdog, whose PATH bug
              # made it false-positive-only until the same date. Evidence:
              # docs/compliance/evidence/hv01-storage-inspection-20261021.txt §11
              monitoring_enabled: false
              ssh_policy: key-only
              os: "debian-13-pve"
              hardware: bare-metal
              vmid: null

            prox01:
              # In provisioning since 2026-08-06 — Dell R640 Node 1.
              # Runbook: docs/runbooks/proxmox-r640-provisioning.md
              hostname: prox01
              ansible_host: 10.60.60.10
              role: hypervisor
              environment: prod
              vlan: 60
              owner: jol-admin
              purpose: "Proxmox VE 9.2 compute node — Dell R640 cluster Node 1"
              backup_enabled: true
              monitoring_enabled: true
              ssh_policy: key-only
              os: "debian-13-pve"
              hardware: bare-metal
              service_tag: JBJ1BW2
              oob_mgmt: "iDRAC9 — 10.10.10.11 (VLAN 10, Gi1/0/40)"
              vmid: null

        backup:
          hosts:
            pbs01:
              hostname: pbs01
              ansible_host: 10.10.10.30
              role: backup-server
              environment: prod
              vlan: 10
              owner: jol-admin
              purpose: "Proxmox Backup Server 4.2 — VM backup target (HP P4500, RAIDZ2)"
              backup_enabled: false
              # Corrected 2026-10-22: was true. node_exporter IS installed, enabled and
              # bound *:9100, but pbs01's nftables input chain is `policy drop` with no
              # 9100 accept and the only documented fleet Prometheus ran on admin01
              # (10.10.10.50), which is off the network — so nothing can scrape it. The
              # control does not function; recorded as a SOC 2 CC7.2 / ISO A.8.16 gap and
              # deliberately NOT fixed by opening the port for a collector that does not
              # exist. Evidence: docs/servers/pbs01.md §Monitoring reality
              monitoring_enabled: false
              # Not Ansible-covered: no playbook targets this group, so chrony/nftables/SSH
              # are host-managed and drift is detected only by audit. The NTP source list
              # lives on-host at /etc/chrony/conf.d/jol-sources.conf (same path role
              # time_sync would write, so onboarding this host converges instead of stacking).
              ansible_coverage: none
              ssh_policy: key-only
              os: "debian-trixie-pbs"
              hardware: bare-metal
              vmid: null

        ai_services:
          vars:
            ansible_user: jol-admin
            ansible_ssh_common_args: '-o ProxyJump=root@10.60.60.20'
          hosts:
            rag-prod-lt01:
              hostname: rag-prod-lt01
              ansible_host: 10.40.40.10
              role: rag
              environment: prod
              vlan: 40
              owner: jol-admin
              purpose: "RAG services, vector databases, document indexing, embeddings"
              backup_enabled: true
              monitoring_enabled: true
              ssh_policy: key-only
              os: "ubuntu-24.04"
              hardware: vm
              vmid: 100
              # vmbr1 direct L2 bridge to VLAN 40; ProxyJump via pve-prod-hv01 as fallback

            mcp-prod-lt01:
              hostname: mcp-prod-lt01
              ansible_host: 10.40.40.11
              role: mcp
              environment: prod
              vlan: 40
              owner: jol-admin
              purpose: "Model Context Protocol server, tool registry, agent integrations"
              backup_enabled: true
              monitoring_enabled: true
              ssh_policy: key-only
              os: "ubuntu-24.04"
              hardware: vm
              vmid: 101
              # vmbr1 direct L2 bridge to VLAN 40; ProxyJump via pve-prod-hv01 as fallback

            her-prod-lt01:
              hostname: her-prod-lt01
              ansible_host: 10.40.40.12
              role: hermes
              environment: prod
              vlan: 40
              owner: jol-admin
              purpose: "Hermes agent orchestration, workflows, automation"
              backup_enabled: true
              monitoring_enabled: true
              ssh_policy: key-only
              os: "ubuntu-24.04"
              hardware: vm
              vmid: 102
              # vmbr1 direct L2 bridge to VLAN 40; ProxyJump via pve-prod-hv01 as fallback

        tf_runner:
          # Self-hosted Terraform / GitHub Actions runner (church tree).
          # Provisioned on prox01 via cloud-init + provision-terraform-runner.yml.
          # Tree segregation (§0.2): marketplace tree uses a SEPARATE runner in
          # jolarca-infrastructure — never co-located here.
          vars:
            ansible_user: jol-admin
            ansible_ssh_common_args: '-o ProxyJump=root@10.60.60.10'
          hosts:
            tf-runner-prod-01:
              hostname: tf-runner-prod-01
              ansible_host: 10.60.60.31
              role: terraform-runner
              environment: prod
              vlan: 60
              owner: jol-admin
              purpose: "Self-hosted Terraform/Actions runner (church tree) — mgmt VLAN"
              backup_enabled: true
              monitoring_enabled: true
              ssh_policy: key-only
              os: "ubuntu-24.04"
              hardware: vm
              vmid: 206
              # 2 vCPU / 8 GB / 100 GB on prox01 (VLAN 60); egress to GitHub +
              # Proxmox API only; no inbound except SSH from the mgmt VLAN.

        tf_state_db:
          # Dedicated PostgreSQL for the Terraform `pg` state backend.
          # Provisioned on prox01 via cloud-init + provision-terraform-state-db.yml.
          # Locking: native Postgres advisory locks (auto-release on session abort).
          vars:
            ansible_user: jol-admin
            ansible_ssh_common_args: '-o ProxyJump=root@10.60.60.10'
          hosts:
            tfstate-prod-01:
              hostname: tfstate-prod-01
              ansible_host: 10.60.60.32
              role: terraform-state-db
              environment: prod
              vlan: 60
              owner: jol-admin
              purpose: "Terraform `pg` state backend — dedicated PostgreSQL (mgmt VLAN)"
              backup_enabled: true
              monitoring_enabled: true
              ssh_policy: key-only
              os: "ubuntu-24.04"
              hardware: vm
              vmid: 205
              # 2 vCPU / 4 GB / 40 GB on prox01 (VLAN 60); 5432/tcp allowed from
              # the runner (10.60.60.31) only; TLS in transit; ZFS-encrypted at rest.
