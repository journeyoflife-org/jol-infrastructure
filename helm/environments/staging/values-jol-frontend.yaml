# staging values for jol-frontend
replicaCount: 2

image:
  tag: "latest"  # Override in CI with git SHA

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1024Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75

ingress:
  hosts:
    - host: "jol-frontend-staging.journeyoflife.org"
      paths:
        - path: /
          pathType: Prefix

externalSecrets:
  enabled: true
  secrets:
    - key: database-url
      remoteKey: "staging/jol-frontend/database"
      property: url
    - key: secret-key
      remoteKey: "staging/jol-frontend/app"
      property: secret_key
