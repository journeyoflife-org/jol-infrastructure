# staging values for infrastructure services
externalSecrets:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

certManager:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

monitoring:
  enabled: true
  prometheus:
    retention: 30d
    storage: 50Gi
  grafana:
    persistence:
      size: 10Gi
