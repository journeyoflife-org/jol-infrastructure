# Service Accounts — automountServiceAccountToken: false
# IRSA annotations for AWS access (no static credentials)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jol-backend
  namespace: jol-backend
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/jol-backend-irsa"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jol-frontend
  namespace: jol-frontend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jol-analytics
  namespace: jol-analytics
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/jol-analytics-irsa"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jol-commerce
  namespace: jol-commerce
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/jol-commerce-irsa"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring-reader
  namespace: monitoring
automountServiceAccountToken: false
