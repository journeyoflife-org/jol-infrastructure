# ClusterSecretStore — Vaultwarden backend via ESO
# ADR-003 — Secrets managed externally, synced to K8s Secrets
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vaultwarden
spec:
  provider:
    webhook:
      url: "https://vaultwarden.internal/api/objects/organization/{{ .remoteRef.key }}"
      headers:
        Authorization: "Bearer {{ .auth.token }}"
      result:
        jsonPath: "$.data.{{ .remoteRef.property }}"
      secrets:
        - name: auth
          secretRef:
            name: vaultwarden-credentials
            namespace: external-secrets
            key: api-token
