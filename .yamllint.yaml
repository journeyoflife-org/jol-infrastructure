# yamllint configuration
# https://yamllint.readthedocs.io/

extends: default

# Exclude vendored, generated, and template directories.
# Helm templates contain Go template directives ({{- }}) that are not valid YAML;
# lint the rendered output via `helm template | yamllint` instead.
ignore: |
  .venv/
  .terraform/
  terraform/.external_modules/
  terraform/environments/*/.terraform/
  terraform/bootstrap/.terraform/
  helm/charts/*/templates/
  helm/charts/*/charts/
  node_modules/

rules:
  line-length:
    max: 200
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true

  document-start: disable

  truthy:
    allowed-values: ['true', 'false', 'yes', 'no']
    check-keys: false

  comments:
    min-spaces-from-content: 1

  indentation:
    spaces: 2
    indent-sequences: true

  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
