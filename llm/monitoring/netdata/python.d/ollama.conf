# Netdata prometheus plugin job — jol-llm exporter.
# Deployed to /etc/netdata/python.d/prometheus.conf (appended as the
# `ollama` job) by the netdata Ansible role.
#
# The exporter (monitoring/exporters/ollama-metrics.py) is loopback-only
# (127.0.0.1:9101), so no TLS or auth is required and no secret leaves the
# host — consistent with the air-gap policy.

ollama:
  name: "ollama"
  url: "http://127.0.0.1:9101/metrics"
  update_every: 10
  # Keep metric families flat; Netdata adds the `prometheus.` prefix used
  # by the health.d alert templates in this repository.
