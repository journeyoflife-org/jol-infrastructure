# Netdata health alerts — Ollama platform
# Source of truth for llm-prod-lt01. Deployed to /etc/netdata/health.d/
# by infra/playbooks/05-monitoring.yml. A mirror copy lives in
# config/netdata/health.d/ollama.conf for audit packaging.
#
# Metric names carry the `prometheus.` prefix because the exporter at
# monitoring/exporters/ollama-metrics.py is ingested via Netdata's
# prometheus plugin (see monitoring/netdata/python.d/ollama.conf).

template: llm_tokens_per_sec
on: prometheus.ollama_generate_tokens_per_second
lookup: average -10s
units: tok/s
every: 10s
warn: $this < 0.7
crit: $this < 0.3
info: Generation throughput below baseline (3950X CPU inference)
to: sysadmin

template: llm_queue_depth
on: prometheus.ollama_bridge_queue_depth
lookup: average -5m
units: requests
every: 30s
warn: $this > 1.5
crit: $this > 3
info: Sustained request queueing at the API bridge
to: sysadmin

template: llm_model_resident
on: prometheus.ollama_model_resident
lookup: last -2m
units: boolean
every: 30s
crit: $this < 1
info: Primary model not loaded — API will fail
to: sysadmin

template: cpu_temperature_llm
on: sensors.temperature_generic
lookup: max -1m
units: Celsius
every: 10s
warn: $this > 82
crit: $this > 88
info: 3950X thermal headroom low — throttling risk for inference
to: sysadmin

template: ram_free_llm
on: system.ram
lookup: average -1m
units: GiB
every: 30s
warn: $this < 25
crit: $this < 12
info: Free RAM approaching model-load floor
to: sysadmin

template: exporter_staleness_llm
on: prometheus.ollama_exporter_last_poll_timestamp_seconds
lookup: max -2m
every: 60s
calc: now() - $this
warn: $this > 120
crit: $this > 300
info: Metrics exporter stopped polling — monitoring is blind
to: sysadmin
