# charts.d collector configuration for the jol-llm exporter.
# Deploy alongside ollama.chart.sh to /etc/netdata/charts.d/.

# Loopback endpoint of monitoring/exporters/ollama-metrics.py.
ollama_endpoint="http://127.0.0.1:9101/metrics"

# Scrape cadence; matches the exporter poll interval.
ollama_update_every=10
