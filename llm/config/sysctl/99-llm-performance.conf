# /etc/sysctl.d/99-llm-performance.conf
# Inference host tuning for llm-prod-lt01 (96 GB DDR4, NVMe).
# Deployed by infra/playbooks/01-os-hardening.yml

# Keep model weights + KV cache resident; swap is a crash-avoidance last
# resort only.
vm.swappiness=1

# Generous dirty-page limits: model loads are read-heavy; avoid writeback
# storms from audit/backup jobs stalling inference reads.
vm.dirty_ratio=20
vm.dirty_background_ratio=5
vm.dirty_expire_centisecs=1500

# Transparent Huge Pages: madvise avoids the latency spikes THP
# compaction causes during long CPU inference runs.
vm.transparent_hugepage=madvise
vm.transparent_hugepage.defrag=madvise

# Large mmap of 34 GiB GGUF files benefits from readahead.
vm.max_map_count=1048576

# Network: small API payloads; keep defaults sane, raise conntrack-free
# backlog for bursty internal traffic.
net.core.somaxconn=1024
net.ipv4.tcp_max_syn_backlog=2048

# Kernel hardening side-effects (also security baseline)
kernel.kptr_restrict=2
kernel.dmesg_restrict=1
kernel.yama.ptrace_scope=1
