# =============================================================================
# role: time_sync — chrony NTP synchronisation (SOC 2 CC6.1 — audit clock sync)
# =============================================================================
---
- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present

- name: Deploy JOL NTP sources drop-in
  ansible.builtin.template:
    src: chrony-jol.conf.j2
    dest: /etc/chrony/conf.d/jol-sources.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart chrony

- name: Ensure chrony is enabled and running
  ansible.builtin.systemd_service:
    name: chrony
    enabled: true
    state: started
