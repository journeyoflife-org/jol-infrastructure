# =============================================================================
# role: monitoring — handlers
# =============================================================================
---
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    state: restarted

- name: restart promtail
  ansible.builtin.systemd_service:
    name: promtail
    state: restarted
  when: promtail_enabled | bool
