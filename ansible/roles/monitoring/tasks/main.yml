# =============================================================================
# role: monitoring — tasks
# =============================================================================
---
- name: Create node_exporter service account
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download node_exporter release (SHA-256 verified)
  ansible.builtin.get_url:
    url: >-
      https://github.com/prometheus/node_exporter/releases/download/v{{
      node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz
    dest: /tmp/node_exporter.tar.gz
    checksum: "sha256:{{ node_exporter_sha256 }}"
    mode: "0644"
  register: node_exporter_download

- name: Extract node_exporter binary
  ansible.builtin.unarchive:
    src: /tmp/node_exporter.tar.gz
    dest: /tmp
    remote_src: true
    creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"

- name: Install node_exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: restart node_exporter

- name: Deploy node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    enabled: true
    state: started

- name: Create promtail service account
  ansible.builtin.user:
    name: promtail
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download Promtail release (SHA-256 verified)
  ansible.builtin.get_url:
    url: >-
      https://github.com/grafana/loki/releases/download/v{{
      promtail_version }}/promtail-linux-amd64.zip
    dest: /tmp/promtail.zip
    checksum: "sha256:{{ promtail_sha256 }}"
    mode: "0644"

- name: Install Promtail binary
  ansible.builtin.unarchive:
    src: /tmp/promtail.zip
    dest: /usr/local/bin
    remote_src: true
    creates: /usr/local/bin/promtail-linux-amd64

- name: Create Promtail configuration directory
  ansible.builtin.file:
    path: /etc/promtail
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy Promtail configuration (staged)
  ansible.builtin.template:
    src: promtail.yml.j2
    dest: /etc/promtail/config.yml
    owner: root
    group: root
    mode: "0640"
  notify: restart promtail

- name: Deploy Promtail systemd unit (staged)
  ansible.builtin.template:
    src: promtail.service.j2
    dest: /etc/systemd/system/promtail.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Promtail service state follows promtail_enabled flag
  ansible.builtin.systemd_service:
    name: promtail
    enabled: "{{ promtail_enabled }}"
    state: "{{ promtail_enabled | ternary('started', 'stopped') }}"
  register: promtail_state

- name: Report Promtail staging decision (audit trail)
  ansible.builtin.debug:
    msg: >-
      Promtail {{ 'ENABLED shipping to ' + loki_push_url if promtail_enabled
      else 'STAGED (binary+config installed, service disabled) — Loki endpoint
      not provisioned yet; enable by setting promtail_enabled=true' }}
