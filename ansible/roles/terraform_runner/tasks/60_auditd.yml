# =============================================================================
# 60_auditd.yml — tamper-evident watches on runner secret + state material
# GDPR Art. 30 / SOC 2 CC6.1 / CC7.2. Merged with the baseline jol-hardening
# rules; auditd concatenates all files under /etc/audit/rules.d/.
# =============================================================================
---
- name: Deploy terraform-runner audit rules
  ansible.builtin.template:
    src: audit-terraform-runner.rules.j2
    dest: /etc/audit/rules.d/jol-terraform-runner.rules
    owner: root
    group: root
    mode: "0640"
  notify: tf_runner reload auditd

- name: Ensure auditd is enabled and running
  ansible.builtin.systemd_service:
    name: auditd
    enabled: true
    state: started
