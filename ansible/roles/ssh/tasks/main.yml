# =============================================================================
# role: ssh — sshd hardening (CIS Ubuntu 24.04 5.2.x)
# Drop-in lands at 00-*.conf: sshd applies first-match-wins across includes,
# so this file overrides any cloud-init defaults (e.g. 50-cloud-init.conf).
# =============================================================================
---
- name: Deploy hardened sshd drop-in configuration
  ansible.builtin.template:
    src: 00-jol-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-jol-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify:
    - validate full sshd config
    - restart sshd

- name: Ensure ssh service is enabled and running
  ansible.builtin.systemd_service:
    name: ssh
    enabled: true
    state: started
