# =============================================================================
# role: ssh — handlers (validate BEFORE restart: never lock out blindly)
# =============================================================================
---
- name: validate full sshd config
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: restart sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted
