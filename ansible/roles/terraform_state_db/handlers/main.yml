# =============================================================================
# role: terraform_state_db — handlers
# Prefixed to avoid collision with the `monitoring` role handlers when both
# roles run in the same play (handler names are play-global).
# =============================================================================
---
- name: tfstate restart postgresql
  ansible.builtin.systemd_service:
    name: postgresql
    state: restarted

- name: tfstate reload auditd
  ansible.builtin.command: augenrules --load
  changed_when: true
