#cloud-config
# NOTE: line 1 MUST remain the literal `#cloud-config` marker (no leading space).
# yamllint emits one non-fatal `comments` warning for it — an accepted cloud-init
# false positive (the non-strict pre-commit hook returns rc=0). Coverage of the
# rest of this file stays active so real errors are still caught.
# =============================================================================
# tfstate-prod-01 — base OS bootstrap (Proxmox cloud-init userdata)
# =============================================================================
# Applied at VM CREATION time on prox01 (qm ... --cicustom user=cloud-init-userdata.yaml).
# Base OS ONLY. PostgreSQL + hardening is applied afterwards by the
# `terraform_state_db` Ansible role (single source of truth).
#
# Secrets (SSH keys, tfstate role password) are injected via Proxmox ciuser /
# Vaultwarden — NEVER committed here (AGENTS.md §0.1).
# =============================================================================
hostname: tfstate-prod-01
fqdn: tfstate-prod-01.jol.internal
timezone: Europe/Vilnius
locale: en_US.UTF-8

package_update: true
package_upgrade: true
packages:
  - qemu-guest-agent      # fs-consistent PBS snapshots
  - chrony                # NTP synchronisation (SOC 2 CC7.2)
  - curl
  - git
  - jq
  - unzip
  - ca-certificates
  - ufw
  - fail2ban
  - auditd
  - aide

users:
  - name: jol-admin
    groups: [sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    # Public key injected by Proxmox cloud-init (ciuser) — never hardcode here.
    ssh_authorized_keys: []

ssh_pwauth: false
disable_root: false        # root key-only; hardened by the `ssh` role post-boot

runcmd:
  - systemctl enable --now qemu-guest-agent
  - systemctl enable --now chrony
  - systemctl enable --now auditd

final_message: >-
  cloud-init base complete. Next: run
  ansible-playbook playbooks/provision-terraform-state-db.yml --limit tf_state_db
