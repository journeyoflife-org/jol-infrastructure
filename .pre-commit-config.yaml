# =============================================================================
# pre-commit hooks
# Runs on every commit to enforce quality and security standards
# Install: pre-commit install
# =============================================================================
repos:
  # --- Secret Detection ---
  # Local secret gate. It used to be `repo: https://github.com/trufflesecurity/trufflehog`
  # rev v3.82.0 with `language: golang`, which CANNOT BUILD on this workstation: no Go
  # toolchain, and apt's candidate (1.22) is rejected by the hook's own dependency
  # `golang.org/x/tools v0.24.0` → `tokeninternal.go:64:9: invalid array length -delta*delta`
  # (measured 2026-11-01T16:32Z, where it aborted a `git commit`). A gate that cannot start
  # is decoration, so the hook now runs a pinned image through a reviewable wrapper:
  # scripts/maintenance/trufflehog-docker-scan.sh (digest pin, detection mode, and it
  # EXITS NON-ZERO when Docker or the image is unavailable rather than reporting a pass).
  # CI remains the authoritative verified scan (infra-validate.yml `trufflehog-scan`,
  # action pinned by SHA; 5 jobs depend on it).
  - repo: local
    hooks:
      - id: trufflehog
        name: TruffleHog Secret Scan (pinned image, detection mode)
        language: system
        entry: bash scripts/maintenance/trufflehog-docker-scan.sh
        stages: [pre-commit]
        pass_filenames: true

  # --- Terraform ---
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.92.0
    hooks:
      - id: terraform_fmt
        name: Terraform Format
      - id: terraform_validate
        name: Terraform Validate
      - id: terraform_checkov
        name: Checkov Policy Scan
        args:
          - --args=--config-file=policies/checkov/.checkov.yaml
      - id: terraform_tfsec
        name: tfsec Security Scan
        args:
          - --args=--config-file=policies/tfsec/config.yaml

  # --- YAML ---
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  # --- Shell ---
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [-x]

  # --- Repo-local structural checks ---
  # `language: system` so no network fetch is needed. Added for issue #134: 6 rows of the CC8.1
  # evidence table contained unescaped `|` and rendered with phantom columns.
  #
  # CLAIM CORRECTED 2026-11-05. This block used to say: "NOTE FOR WHOEVER INSTALLED THIS:
  # `pre-commit install` has never been run on this working copy (`.git/hooks/pre-commit` is
  # absent), so these hooks are advisory until installed." Measured false on every term — the
  # hook exists, is executable and is pre-commit-generated (`-rwxrwxr-x`, 632 bytes, second line
  # `# File generated by pre-commit`), and every `git commit` made in this session printed real
  # hook results (five independent commit logs checked): TruffleHog, shellcheck, Record Stamp
  # Integrity, trim trailing whitespace, fix end of files, check for merge conflicts, detect
  # private key, don't commit to branch, check for added large files — all Passed. A comment
  # claiming these checks do not run is an invitation to merge a change without running them,
  # which is how an advisory note becomes a real gap.
  #
  # The caveat the old claim was fumbling toward is narrower and genuinely load-bearing: hooks
  # fire on `git commit` only. A commit assembled with `git commit-tree` against a temporary
  # index — the method this repo uses when CHANGELOG.md must be derived from HEAD rather than
  # from a shared dirty worktree — BYPASSES .git/hooks entirely. Those commits must run
  # check-changelog-table.py and check-record-stamps.py against the exact blob by hand, and the
  # orchestrators in scripts/maintenance do exactly that.
  # ⚠ CLAIM CORRECTED 2026-11-01 (finding F-14): the reason it reached `main` was NOT "CI skips
  #   docs-only merges" — `on.pull_request` has no paths filter, and a docs-only merge was measured
  #   to carry 7 completed check runs. The real gaps were (a) NO job invoked this checker and
  #   (b) a direct push to `main` touching only docs/CHANGELOG matched no `on.push.paths` at all.
  #   Both are closed in `infra-validate.yml`: job `changelog-guard` + widened push paths.
  - repo: local
    hooks:
      - id: changelog-table
        name: CHANGELOG Table Structure
        entry: python3 scripts/maintenance/check-changelog-table.py --self-test
        language: system
        files: ^CHANGELOG\.md$
        pass_filenames: false

      # Added 2026-11-01 (found while verifying issue #137): 37 stamps across the ledger and host
      # docs were tz-hybrids — a local DATE with a UTC CLOCK (off by one day), or a local CLOCK
      # wearing a `Z` (off by two hours). `make lint-changelog` counts columns, not clock values, so
      # all of it reached `main` unflagged. This hook fails a `...Z` stamp that had not happened yet
      # when the record was written; see the module docstring for the artifact proof of each class.
      - id: record-stamps
        name: Record Stamp Integrity
        entry: python3 scripts/maintenance/check-record-stamps.py --self-test
        language: system
        files: ^(CHANGELOG\.md|AGENTS\.md|docs/.*\.(md|txt))$
        pass_filenames: false

  # --- General ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main, --branch, develop]
      - id: check-added-large-files
        args: [--maxkb=500]
