# =============================================================================
# pre-commit hooks
# Runs on every commit to enforce quality and security standards
# Install: pre-commit install
# =============================================================================
repos:
  # --- Secret Detection ---
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.99.7
    hooks:
      - id: trufflehog
        name: TruffleHog Secret Scan
        entry: trufflehog filesystem --only-verified
        stages: [pre-commit]

  # --- Terraform ---
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.4
    hooks:
      - id: terraform_fmt
        name: Terraform Format
      - id: terraform_validate
        name: Terraform Validate
      - id: terraform_checkov
        name: Checkov Policy Scan
        args:
          - --args=--config-file=policies/checkov/.checkov.yaml
      - id: terraform_tfsec
        name: tfsec Security Scan
        args:
          - --args=--config-file=policies/tfsec/config.yaml

  # --- YAML ---
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  # --- Shell ---
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: [-x]

  # --- Repo-local structural checks ---
  # `language: system` so no network fetch is needed. NOTE FOR WHOEVER INSTALLED THIS:
  # `pre-commit install` has never been run on this working copy (`.git/hooks/pre-commit`
  # is absent), so these hooks are advisory until installed — the same controls are
  # reachable via `make lint` / the CI jobs. Added for issue #134: 6 rows of the CC8.1
  # evidence table contained unescaped `|` and rendered with phantom columns, and no
  # existing gate could see it (infra-validate.yml skips docs-only pushes entirely).
  - repo: local
    hooks:
      - id: changelog-table
        name: CHANGELOG Table Structure
        entry: python3 scripts/maintenance/check-changelog-table.py --self-test
        language: system
        files: ^CHANGELOG\.md$
        pass_filenames: false

  # --- General ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main, --branch, develop]
      - id: check-added-large-files
        args: [--maxkb=500]
